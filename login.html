<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Vehicle Assignment</title><link rel="stylesheet" href="/styles.css"></head><body class="login-page"><main class="login-wrap"><section class="card login-card"><div class="login-brand"><img class="login-vona" src="/assets/vona-logo.png" alt="VONA — Vehicle Operability North America"><h1>Vehicle Assignment</h1><p>Sign in to continue</p></div><form id="loginForm" class="card-body"><div class="field"><label for="role">Access type</label><select id="role" name="role"><option value="team">Teammate</option><option value="manager">Rob Caudill (Manager)</option><option value="admin">Administrator</option></select></div><div id="managerLogo" class="login-manager-logo" hidden><img src="/assets/rob-caudill-logo.png" alt="Rob Caudill"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autofocus autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button><p id="loginError" class="login-error"></p></form></section></main><script>const params=new URLSearchParams(location.search),form=document.querySelector('#loginForm'),role=document.querySelector('#role'),managerLogo=document.querySelector('#managerLogo');function showRoleLogo(){managerLogo.hidden=role.value!=='manager'}const next=params.get('next');if(['manager','team','admin'].includes(next))role.value=next;showRoleLogo();role.addEventListener('change',showRoleLogo);form.addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#loginError');error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),d=await r.json();if(!r.ok)throw new Error(d.error);location.href=`/${role.value}`}catch(ex){error.textContent=ex.message}});</script></body></html>
