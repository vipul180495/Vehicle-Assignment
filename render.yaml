services:
  - type: web
    name: vehicle-assignment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: TEAM_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEAMS_WEBHOOK_URL
        sync: false
